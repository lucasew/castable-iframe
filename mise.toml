[tasks.ci]
description = "Verify file structure and links"
run = [
    "test -f src/style.css || { echo 'src/style.css missing'; exit 1; }",
    "test -f src/script.js || { echo 'src/script.js missing'; exit 1; }",
    "grep -q 'link rel=\"stylesheet\" href=\"src/style.css\"' index.html || { echo 'CSS link missing'; exit 1; }",
    "grep -q 'script src=\"src/script.js\"' index.html || { echo 'JS script missing'; exit 1; }",
    "echo 'CI Passed'"
]
