<!DOCTYPE html>
<html>

<head>
  <title>Streamable iframe</title>
  <style>
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    iframe {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <iframe frameborder="0" allowfullscreen sandbox="allow-downloads allow-forms allow-modals allow-pointer-lock allow-popups allow-presentation allow-same-origin allow-scripts" id="content"></iframe>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search)
      const url = params.has('url') ? params.get('url') : prompt("URL:")
      document.getElementById('content').src = url
    })()
  </script>
</body>

</html>
