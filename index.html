<!DOCTYPE html>
<html>

<head>
  <title>Streamable iframe</title>
  <style>
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    iframe {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <iframe frameborder="0" allowfullscreen id="content"></iframe>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search)
      let url = params.has('url') ? params.get('url') : prompt("URL:")
      if (url) {
        url = url.trim();
        if (url.startsWith('http://') || url.startsWith('https://')) {
          document.getElementById('content').src = url;
        } else {
          alert("Invalid URL. Only http:// and https:// are allowed.");
        }
      }
    })();
  </script>
</body>

</html>
