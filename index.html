<!DOCTYPE html>
<html>

<head>
  <title>Streamable iframe</title>
  <style>
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    iframe {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <iframe frameborder="0" allowfullscreen id="content"></iframe>
  <script>
    (function () {
      function reportError(error, context) {
        console.error("Centralized Error Reporter:", error, context);
      }
      try {
        const params = new URLSearchParams(window.location.search);
        const url = params.has("url") ? params.get("url") : prompt("URL:");
        if (!url) {
          throw new Error("No URL provided");
        }
        document.getElementById("content").src = url;
      } catch (error) {
        reportError(error, { location: "index.html init" });
      }
    })();
  </script>
</body>

</html>
